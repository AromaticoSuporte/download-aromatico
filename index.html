<style>
  :root{
    --bg-1: #121014;
    --bg-2: #1c1720;
    --gold: #c9a877;
    --gold-light: #e9d3a8;
    --graphite: #94908f;
    --ink: #f4efe6;
    --ink-dim: #a89f90;
    --ink-faint: #726c60;
    --line: rgba(244, 239, 230, 0.14);
    --radius: 7px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    background:
      radial-gradient(ellipse 640px 520px at 50% 6%, rgba(233, 211, 168, 0.28), transparent 62%),
      linear-gradient(155deg, #2a2620 0%, #1a1720 38%, #121014 68%, #0c0b0e 100%);
    color: var(--ink);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 40px;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* fine grain texture, like a matte perfume box finish */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .card{
    width: 100%;
    max-width: 380px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .mark{
    width: 148px;
    height: 148px;
    margin: 0 auto 22px;
    opacity: 0;
    transform: translateY(10px) scale(0.96);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }

  .mark-frame{
    width: 100%;
    height: 100%;
    background: #ffffff;
    border-radius: 33px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.38),
      0 2px 0 rgba(255, 255, 255, 0.5) inset,
      0 0 0 1px rgba(0, 0, 0, 0.04);
  }

  .mark img{
    width: 62%;
    height: auto;
    display: block;
  }

  h1{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 11vw, 3.1rem);
    letter-spacing: -0.01em;
    line-height: 1;
    margin: 6px 0 10px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
  }

  .tagline{
    font-family: 'Poppins', sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--gold-light);
    margin: 0 0 18px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.24s forwards;
  }

  p.desc{
    font-size: 0.96rem;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 30ch;
    margin: 0 auto 30px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
  }

  .stores{
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .store-btn{
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 14px 20px;
    border-radius: var(--radius);
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.96rem;
    letter-spacing: 0.005em;
    border: 1px solid var(--line);
    color: var(--ink);
    background: rgba(244, 239, 230, 0.03);
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }

  .store-btn svg{ flex: none; width: 20px; height: 20px; }

  .store-btn:hover{
    border-color: rgba(244, 239, 230, 0.32);
    background: rgba(244, 239, 230, 0.06);
  }

  .store-btn:active{ transform: scale(0.985); }

  .store-btn.primary{
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    border-color: transparent;
    color: #1a1510;
  }

  .store-btn.primary:hover{
    background: linear-gradient(180deg, #f0dcb2, #d4b585);
  }

  .store-btn:focus-visible{
    outline: 2px solid var(--gold-light);
    outline-offset: 3px;
  }

  footer{
    margin-top: 34px;
    font-size: 0.76rem;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .mark, h1, .tagline, p.desc, .stores, footer{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  @media (max-width: 340px){
    .mark{ width: 128px; height: 128px; }
  }
</style>
</head>
